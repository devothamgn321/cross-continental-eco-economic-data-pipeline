services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_DB: t9pipe
      POSTGRES_USER: jhu
      POSTGRES_PASSWORD: jhu123
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jhu -d t9pipe"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: t9pipe
      DB_USER: jhu
      DB_PASSWORD: jhu123
      EIA_API_KEY: ${EIA_API_KEY}
      WEATHER_BASE_URL: ${WEATHER_BASE_URL}
    ports:
      - "8001:8001"
    volumes:
      - .:/app

  jupyter:
    build: .
    depends_on:
      db:
        condition: service_healthy
      app:
        condition: service_started
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: t9pipe
      DB_USER: jhu
      DB_PASSWORD: jhu123
      EIA_API_KEY: ${EIA_API_KEY}
      WEATHER_BASE_URL: ${WEATHER_BASE_URL}
      API_BASE_URL: http://app:8001
    command: >
      jupyter lab --ip=0.0.0.0 --port=8888 --no-browser --allow-root
    ports:
      - "8888:8888"
    volumes:
      - .:/app

volumes:
  postgres_data: